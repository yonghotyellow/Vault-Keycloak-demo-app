<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#174d3c">
  <title>{{ portal_title }}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='app2.css') }}">
</head>
<body class="course-page">
  <header class="course-topbar">
    <div class="course-brand"><span class="course-brand-dot"></span> {{ portal_title }}</div>
    <div class="course-user-info">
      <span>Xin chào, <b>{{ current_user }}</b></span>
      <a href="{{ url_for('logout') }}">Đăng xuất</a>
    </div>
  </header>

  <main class="course-list" aria-label="Red Hat training courses">
    {% for course in courses %}
    <article class="course-card">
      <h2>{{ course.code }}</h2>
      <p>{{ course.title }}</p>
    </article>
    {% endfor %}
  </main>
</body>
</html>
