<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Đăng nhập — {{ portal_title or 'Amigo Customer Onboarding' }}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <div class="login-wrap">
    <div class="login-card">
      <h1>{{ portal_title or 'Amigo Onboarding Portal' }}</h1>
      <p class="subtitle"></p>

      {% if keycloak_enabled %}
      <div style="text-align:center; margin-top:1rem;">
        <a class="btn-sso btn-full" href="{{ url_for('login_keycloak') }}">
          <img src="{{ url_for('static', filename='redhat.png') }}" alt="SSO" />
          <span>Đăng nhập bằng Keycloak</span>
        </a>
      </div>
      {% else %}
      <div class="error-banner" role="alert">Keycloak chưa được cấu hình.</div>
      {% endif %}
    </div>
  </div>
  
</body>
</html>
