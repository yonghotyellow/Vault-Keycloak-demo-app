<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#174d3c">
  <title>Đăng nhập — {{ portal_title }}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='app2.css') }}">
</head>
<body class="app2-login">
  <div class="login-wrap">
    <div class="login-card">
      <h1>{{ portal_title }}</h1>
      <p class="subtitle"></p>

      {% if keycloak_enabled %}
      <div class="app2-keycloak">
        <a class="btn-sso btn-full" href="{{ url_for('login_keycloak') }}">
          <img src="{{ url_for('static', filename='redhat.png') }}" alt="SSO">
          <span>Đăng nhập bằng Keycloak</span>
        </a>
      </div>
      {% else %}
      <div class="error-banner" role="alert">Keycloak chưa được cấu hình.</div>
      {% endif %}
    </div>
  </div>
</body>
</html>
